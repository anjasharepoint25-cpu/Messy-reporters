[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "messy-reporter"
version = "0.1.0"
description = "Clean messy CSV and Excel files into JSON or Markdown reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Messy Reporter contributors" }
]
keywords = ["csv", "excel", "json", "markdown", "data-cleaning", "reporting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
]
dependencies = [
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
]

[project.scripts]
messy-reporter = "messy_reporter.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/messy-reporter"
Issues = "https://github.com/your-org/messy-reporter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
messy_reporter = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true
